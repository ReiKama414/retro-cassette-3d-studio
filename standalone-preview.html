      // =========================================================================
      // 2. STUDIO ENVIRONMENT & SHADOW TEXTURES
      // =========================================================================
      function createStudioEnvironmentTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0.0, '#ffffff');
        grad.addColorStop(0.25, '#fdf2f8');
        grad.addColorStop(0.5, '#f8fafc');
        grad.addColorStop(0.75, '#f1f5f9');
        grad.addColorStop(1.0, '#e2e8f0');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 256);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(40, 25, 160, 50);
        ctx.fillRect(300, 35, 170, 45);
        ctx.fillStyle = 'rgba(244, 114, 182, 0.35)';
        ctx.fillRect(80, 120, 140, 60);
        ctx.fillStyle = 'rgba(96, 165, 250, 0.35)';
        ctx.fillRect(310, 110, 140, 65);

        const tex = new THREE.CanvasTexture(canvas);
        tex.mapping = THREE.EquirectangularReflectionMapping;
        tex.needsUpdate = true;
        return tex;
      }

      function createContactShadowTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(128, 64, 8, 128, 64, 110);
        grad.addColorStop(0.0, 'rgba(59, 7, 36, 0.32)');
        grad.addColorStop(0.45, 'rgba(59, 7, 36, 0.14)');
        grad.addColorStop(1.0, 'rgba(59, 7, 36, 0.0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 128);
        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        return tex;
      }

      // =========================================================================
      // 3. PROCEDURAL STICKER & BACK SHELL TEXTURE GENERATORS
      // =========================================================================
      function roundedRectPath(ctx, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + w - radius, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
        ctx.lineTo(x + w, y + h - radius);
        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        ctx.lineTo(x + radius, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }

      function drawY2KStar(ctx, cx, cy, outerR, innerR, fill, stroke) {
        ctx.save();
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const angle = (i * Math.PI) / 4;
          const r = i % 2 === 0 ? outerR : innerR;
          const x = cx + Math.cos(angle) * r;
          const y = cy + Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 3;
          ctx.stroke();
        }
        ctx.restore();
      }

      function createFrontStickerTexture(theme) {
        const canvas = document.createElement('canvas');
        canvas.width = 1600;
        canvas.height = 900;
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        const s = theme.sticker;

        ctx.clearRect(0, 0, W, H);
        ctx.save();
        roundedRectPath(ctx, 16, 16, W - 32, H - 32, 48);
        ctx.clip();

        const bgGrad = ctx.createLinearGradient(0, 0, W, H);
        bgGrad.addColorStop(0.0, s.gradStart);
        bgGrad.addColorStop(0.52, s.gradMid);
        bgGrad.addColorStop(1.0, s.gradEnd);

        ctx.fillRect(0, 0, W, H);

        const c1 = ctx.createRadialGradient(W * 0.72, H * 0.32, 30, W * 0.72, H * 0.32, 420);

        ctx.fillStyle = 'rgba(255,255,255,0.42)';
        ctx.beginPath();
        ctx.arc(1360, 420, 95, 0, Math.PI * 2);
        ctx.arc(1460, 450, 80, 0, Math.PI * 2);
        ctx.arc(1270, 460, 70, 0, Math.PI * 2);
        ctx.fill();

        // Ringed Planet on Left
        ctx.save();
        ctx.translate(185, 365);
        ctx.rotate(-0.32);
        const pGrad = ctx.createLinearGradient(-70, -70, 70, 70);
        pGrad.addColorStop(0, '#ffffff');
        pGrad.addColorStop(0.5, s.accentBlue);
        pGrad.addColorStop(1, s.accentPink);
        ctx.fillStyle = pGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 68, 0, Math.PI * 2);

        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(0, 0, 155, 36, 0, 0, Math.PI * 2);

        ctx.lineWidth = 7;
        ctx.stroke();

        // Sweeping Y2K Arc
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(140, 220);

        // "COSMIC" Bold Retro Italic
        ctx.save();

        ctx.strokeStyle = s.titleStroke;

        // "Playlist" Script

        ctx.translate(540, 255);

        ctx.strokeStyle = s.titleStroke;
        ctx.strokeText('Playlist', 0, 0);
        ctx.fillStyle = s.scriptColor;
        ctx.fillText('Playlist', 0, 0);
        ctx.restore();

        // Top-Right Badge
        ctx.save();
        roundedRectPath(ctx, 1020, 118, 285, 92, 14);
        ctx.fillStyle = s.badgeBg;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 20px "JetBrains Mono", monospace';
        ctx.fillText('SOUNDS', 1042, 148);
        ctx.fillText('FOR BRIGHTER', 1042, 173);
        ctx.fillText('DAYS', 1042, 198);
        ctx.restore();

        // Y2K Sparkle Stars
        drawY2KStar(ctx, 1365, 255, 86, 20, '#ffffff', s.accentPink);
        drawY2KStar(ctx, 1275, 315, 42, 10, s.accentBlue, '#ffffff');
        drawY2KStar(ctx, 240, 145, 44, 11, '#ffffff', s.accentBlue);
        drawY2KStar(ctx, 960, 165, 28, 7, '#ffffff');

        // Side "A" Oval & "120 MIN"
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(1405, 535, 68, 36, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 38px "IBM Plex Sans", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('• A •', 1405, 537);
        ctx.font = '800 36px "IBM Plex Sans", sans-serif';
        ctx.fillText('120', 1405, 685);
        ctx.font = '700 26px "IBM Plex Sans", sans-serif';
        ctx.fillText('MIN', 1405, 718);
        ctx.restore();

        // Bottom-left STELLAR VIBES ARCHIVE
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 23px "JetBrains Mono", monospace';
        ctx.fillText('STELLAR', 110, 642);
        ctx.fillText('VIBES', 110, 670);
        ctx.fillText('ARCHIVE', 110, 698);
        ctx.restore();

        // Bottom Checkered Y2K Bar
        const stripY = 745;
        const stripH = 68;
        const stripGrad = ctx.createLinearGradient(80, stripY, W - 80, stripY);
        stripGrad.addColorStop(0, s.stripLeft);
        stripGrad.addColorStop(0.5, s.gradMid);
        stripGrad.addColorStop(1, s.stripRight);
        ctx.save();
        roundedRectPath(ctx, 85, stripY, W - 170, stripH, 16);
        ctx.fillStyle = stripGrad;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.stroke();

        const cell = 17;
        for (let r = 0; r < 2; r++) {
          for (let c = 0; c < 7; c++) {
            if ((r + c) % 2 === 0) {
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(280 + c * cell, stripY + 17 + r * cell, cell, cell);
              ctx.fillRect(1160 + c * cell, stripY + 17 + r * cell, cell, cell);
            }
          }
        }
        for (let i = 0; i < 5; i++) {
          drawY2KStar(ctx, 560 + i * 115, stripY + stripH / 2, 14, 4, '#ffffff');
        }
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 21px "JetBrains Mono", monospace';
        ctx.fillText('EDITION // ' + theme.id.toUpperCase(), 115, stripY + 42);
        ctx.restore();

        roundedRectPath(ctx, 26, 26, W - 52, H - 52, 40);
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
        ctx.stroke();

        // Punch out Central Pill Window Cutout
        const winW = 940;
        const winH = 360;
        const winX = (W - winW) / 2;
        const winY = 310;

        roundedRectPath(ctx, winX - 10, winY - 10, winW + 20, winH + 20, winH / 2 + 10);
        ctx.lineWidth = 12;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.globalCompositeOperation = 'destination-out';
        roundedRectPath(ctx, winX, winY, winW, winH, winH / 2);
        ctx.fillStyle = '#000000';
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.restore();

        const tex = new THREE.CanvasTexture(canvas);
        tex.anisotropy = 8;
        tex.needsUpdate = true;
        return tex;
      }

      function createBackShellTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 1600;
        canvas.height = 900;
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        ctx.clearRect(0, 0, W, H);
        ctx.strokeStyle = 'rgba(255,255,255,0.38)';
        ctx.lineWidth = 4;
        roundedRectPath(ctx, 60, 50, W - 120, H - 100, 36);
        ctx.stroke();

        const winW = 940;
        const winH = 360;
        const winX = (W - winW) / 2;
        const winY = 310;
        roundedRectPath(ctx, winX - 14, winY - 14, winW + 28, winH + 28, (winH + 28) / 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.62)';
        ctx.lineWidth = 5;
        ctx.stroke();

        for (let i = 0; i <= 10; i++) {
          const tx = W / 2 - 150 + i * 30;
          const th = i % 5 === 0 ? 22 : 12;
          ctx.beginPath();
          ctx.moveTo(tx, winY + winH / 2 - th / 2);
          ctx.lineTo(tx, winY + winH / 2 + th / 2);
          ctx.strokeStyle = 'rgba(255,255,255,0.55)';
          ctx.lineWidth = i % 5 === 0 ? 4 : 2;
          ctx.stroke();
        }

        ctx.fillStyle = 'rgba(255,255,255,0.58)';
        ctx.font = '700 26px "JetBrains Mono", monospace';
        ctx.fillText('COSMIC AUDIO ARCHIVE // COMPACT CASSETTE', 105, 125);
        ctx.fillText('SIDE B · 120 MIN · NORMAL BIAS 120µs EQ', 105, 825);
        ctx.textAlign = 'right';
        ctx.fillText('ONE SEALED CASE · CLEAR BACK', W - 105, 125);
        ctx.fillText('3D WEBGL PRECISION SHELL', W - 105, 825);

        const tex = new THREE.CanvasTexture(canvas);
        tex.anisotropy = 8;
        tex.needsUpdate = true;
        return tex;
      }

      // =========================================================================
      // 4. BUILD THE SINGLE LARGE 3D CASSETTE SCENE
      // =========================================================================
      function createRoundedRectShape(width, height, radius) {
        const shape = new THREE.Shape();
        const x = -width / 2;
        const y = -height / 2;
        shape.moveTo(x + radius, y);
        shape.lineTo(x + width - radius, y);
        shape.quadraticCurveTo(x + width, y, x + width, y + radius);
        shape.lineTo(x + width, y + height - radius);
        shape.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        shape.lineTo(x + radius, y + height);
        shape.quadraticCurveTo(x, y + height, x, y + height - radius);
        shape.lineTo(x, y + radius);
        shape.quadraticCurveTo(x, y, x + radius, y);
        return shape;
      }

      function createStadiumPath(cx, cy, width, height) {
        const path = new THREE.Path();
        const r = height / 2;
        const halfStraight = Math.max(0, (width - height) / 2);
        path.absarc(cx - halfStraight, cy, r, -Math.PI / 2, Math.PI / 2, true);
        path.absarc(cx + halfStraight, cy, r, Math.PI / 2, -Math.PI / 2, true);
        path.closePath();
        return path;
      }

      function createTapeRollGeo(outerRadius) {
        const s = new THREE.Shape();
        s.absarc(0, 0, outerRadius, 0, Math.PI * 2, false);
        const h = new THREE.Path();
        h.absarc(0, 0, 0.24, 0, Math.PI * 2, true);
        s.holes.push(h);
        const geo = new THREE.ExtrudeGeometry(s, {
          depth: 0.22,
          bevelEnabled: false,
          curveSegments: 44
        });
        geo.center();
        return geo;
      }

      const stageEl = document.getElementById('webgl-stage');
      const scene = new THREE.Scene();

      // Closer default camera (z = 3.25) so the single cassette is large and zoomed-in
      const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
      camera.position.set(0, 0, 3.0);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      stageEl.insertBefore(renderer.domElement, stageEl.firstChild);

      const studioEnvMap = createStudioEnvironmentTexture();
      const shadowTex = createContactShadowTexture();

      // Studio Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 1.25));
      const keyLight = new THREE.DirectionalLight(0xffffff, 2.15);
      keyLight.position.set(4.5, 6.0, 5.5);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xfbcfe8, 1.3);
      fillLight.position.set(-5.0, 3.0, -4.0);
      scene.add(fillLight);

      const rimLight = new THREE.PointLight(0x60a5fa, 1.15, 15);
      rimLight.position.set(2.5, 2.0, -3.5);
      scene.add(rimLight);

      const bottomBounce = new THREE.PointLight(0xf472b6, 0.85, 12);
      bottomBounce.position.set(0, -3.2, 3.0);
      scene.add(bottomBounce);

      // Hierarchy: moveGroup (XY pan/move) -> pivotGroup (3D rotation) -> hoverScaleGroup -> cassetteMesh
      const moveGroup = new THREE.Group();
      const pivotGroup = new THREE.Group();
      const hoverScaleGroup = new THREE.Group();
      moveGroup.add(pivotGroup);
      pivotGroup.add(hoverScaleGroup);
      scene.add(moveGroup);

      // Soft Contact Shadow Plane inside moveGroup so it follows the cassette when moved!
      const shadowPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(3.8, 1.6),
        new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
      );
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.set(0, -1.28, 0);
      moveGroup.add(shadowPlane);

      // Build Cassette Materials & Meshes with live references so colors can be changed at any time
      const W = 3.2;
      const H = 2.04;
      const halfDepth = 0.165;

      const shellShape = createRoundedRectShape(W, H, 0.12);
      shellShape.holes.push(createStadiumPath(0, 0.12, 1.84, 0.72));
      const shellHalfGeo = new THREE.ExtrudeGeometry(shellShape, {
        depth: halfDepth,
        bevelEnabled: true,
        bevelThickness: 0.025,
        bevelSize: 0.025,
        bevelSegments: 4,
        curveSegments: 32
      });

      const frontShellMat = new THREE.MeshPhysicalMaterial({
        color: activeTheme.shellFront,
        envMap: studioEnvMap,
        envMapIntensity: 1.4,
        transparent: true,
        opacity: activeTheme.opacity,
        roughness: 0.14,
        metalness: 0.06,
        clearcoat: 1.0,
        clearcoatRoughness: 0.08,
        reflectivity: 0.9
      });

      const backShellMat = new THREE.MeshPhysicalMaterial({
        color: activeTheme.shellBack,
        envMap: studioEnvMap,
        envMapIntensity: 1.4,
        transparent: true,
        opacity: activeTheme.opacity,
        roughness: 0.14,
        metalness: 0.06,
        clearcoat: 1.0,
        clearcoatRoughness: 0.08,
        reflectivity: 0.9
      });

      const seamMat = new THREE.MeshStandardMaterial({
        color: activeTheme.edgeAccent,
        roughness: 0.25,
        metalness: 0.2,
        transparent: true,
        opacity: 0.72
      });

      const ribMat = new THREE.MeshPhysicalMaterial({
        color: activeTheme.edgeAccent,
        transparent: true,
        opacity: 0.55,
        roughness: 0.2
      });

      const hubMat = new THREE.MeshStandardMaterial({
        color: activeTheme.reelHub,
        roughness: 0.28,
        metalness: 0.18,
        envMap: studioEnvMap
      });

      const teethMat = new THREE.MeshStandardMaterial({
        color: activeTheme.reelTeeth,
        roughness: 0.25,
        metalness: 0.1
      });

      const tapeMat = new THREE.MeshStandardMaterial({
        color: activeTheme.tapeColor,
        roughness: 0.32,
        metalness: 0.25,
        envMap: studioEnvMap
      });

      const frontStickerMat = new THREE.MeshPhysicalMaterial({
        map: createFrontStickerTexture(activeTheme),
        transparent: true,
        alphaTest: 0.05,
        roughness: 0.22,
        metalness: 0.06,
        clearcoat: 0.65,
        envMap: studioEnvMap,
        envMapIntensity: 0.8
      });

      const reverseStickerMat = new THREE.MeshStandardMaterial({
        map: frontStickerMat.map,
        transparent: true,
        alphaTest: 0.05,
        color: 0xfbcfe8,
        roughness: 0.65
      });

      // Assemble Cassette Root Group
      const cassetteRoot = new THREE.Group();
      hoverScaleGroup.add(cassetteRoot);

      const frontShellMesh = new THREE.Mesh(shellHalfGeo, frontShellMat);
      frontShellMesh.position.set(0, 0, 0.008);
      cassetteRoot.add(frontShellMesh);

      const backShellMesh = new THREE.Mesh(shellHalfGeo, backShellMat);
      backShellMesh.position.set(0, 0, -0.173);
      cassetteRoot.add(backShellMesh);

      cassetteRoot.add(new THREE.Mesh(new THREE.BoxGeometry(W - 0.02, H - 0.02, 0.014), seamMat));

      // Bottom Trapezoid Step
      const trapShape = new THREE.Shape();
      const twB = 2.26, twT = 2.08, th = 0.42;
      trapShape.moveTo(-twB / 2, -th / 2);
      trapShape.lineTo(twB / 2, -th / 2);
      trapShape.lineTo(twT / 2, th / 2);
      trapShape.lineTo(-twT / 2, th / 2);
      trapShape.closePath();

      const trapGeo = new THREE.ExtrudeGeometry(trapShape, {
        depth: 0.43,
        bevelEnabled: true,
        bevelThickness: 0.018,
        bevelSize: 0.018,
        bevelSegments: 3
      });
      trapGeo.center();

      const trapGroup = new THREE.Group();
      trapGroup.position.set(0, -0.78, 0);
      trapGroup.add(new THREE.Mesh(trapGeo, frontShellMat));

      const slotMat = new THREE.MeshStandardMaterial({ color: 0x140c12, roughness: 0.8, metalness: 0.2 });
      [-0.68, 0, 0.68].forEach((ox, idx) => {
        const slotMesh = new THREE.Mesh(new THREE.BoxGeometry(idx === 1 ? 0.52 : 0.42, 0.14, 0.34), slotMat);
        slotMesh.position.set(ox, -0.15, 0);
        trapGroup.add(slotMesh);
      });

      const shieldMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.38, 0.16, 0.26),
        new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.85, roughness: 0.22, envMap: studioEnvMap })
      );
      shieldMesh.position.set(0, -0.06, 0);
      trapGroup.add(shieldMesh);

      const padMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.06, 0.22),
        new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.9 })
      );
      padMesh.position.set(0, -0.11, 0);
      trapGroup.add(padMesh);

      const holeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5, metalness: 0.4 });
      [-0.88, -0.42, 0.42, 0.88].forEach((hx) => {
        const hMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.052, 0.45, 16), holeMat);
        hMesh.position.set(hx, -0.05, 0);
        trapGroup.add(hMesh);
      });
      cassetteRoot.add(trapGroup);

      // Central Clear Window Lenses
      const lensShape = new THREE.Shape();
      const lr = 0.355;
      const lHalf = (1.84 - 0.71) / 2;
      lensShape.absarc(-lHalf, 0, lr, -Math.PI / 2, Math.PI / 2, false);
      lensShape.absarc(lHalf, 0, lr, Math.PI / 2, -Math.PI / 2, false);
      lensShape.closePath();

      const leftReelHole = new THREE.Path();
      leftReelHole.absarc(-0.56, 0, 0.21, 0, Math.PI * 2, true);
      const rightReelHole = new THREE.Path();
      rightReelHole.absarc(0.56, 0, 0.21, 0, Math.PI * 2, true);
      lensShape.holes.push(leftReelHole, rightReelHole);

      const lensGeo = new THREE.ExtrudeGeometry(lensShape, { depth: 0.02, bevelEnabled: false, curveSegments: 28 });
      lensGeo.center();
      const lensMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        envMap: studioEnvMap,
        envMapIntensity: 1.5,
        transparent: true,
        opacity: 0.32,
        roughness: 0.05,
        clearcoat: 1.0
      });

      const frontLens = new THREE.Mesh(lensGeo, lensMat);
      frontLens.position.set(0, 0.12, 0.185);
      cassetteRoot.add(frontLens);

      const backLens = new THREE.Mesh(lensGeo, lensMat);
      backLens.position.set(0, 0.12, -0.185);
      cassetteRoot.add(backLens);

      // Front Retro Sticker & Back Embossed Plate
      const stickerGeo = new THREE.PlaneGeometry(2.96, 1.56);
      const frontStickerMesh = new THREE.Mesh(stickerGeo, frontStickerMat);
      frontStickerMesh.position.set(0, 0.12, 0.201);
      cassetteRoot.add(frontStickerMesh);

      const reverseStickerMesh = new THREE.Mesh(stickerGeo, reverseStickerMat);
      reverseStickerMesh.position.set(0, 0.12, 0.197);
      reverseStickerMesh.rotation.y = Math.PI;
      cassetteRoot.add(reverseStickerMesh);

      const backPlateMesh = new THREE.Mesh(
        stickerGeo,
        new THREE.MeshPhysicalMaterial({
          map: createBackShellTexture(),
          transparent: true,
          opacity: 0.88,
          roughness: 0.2,
          metalness: 0.1,
          clearcoat: 0.8,
          envMap: studioEnvMap
        })
      );
      backPlateMesh.position.set(0, 0.12, -0.201);
      backPlateMesh.rotation.y = Math.PI;
      cassetteRoot.add(backPlateMesh);

      // Dual Rotating 6-Tooth Spools / Reels
      const reelHubShape = new THREE.Shape();
      reelHubShape.absarc(0, 0, 0.235, 0, Math.PI * 2, false);
      const reelInnerHole = new THREE.Path();
      reelInnerHole.absarc(0, 0, 0.145, 0, Math.PI * 2, true);
      reelHubShape.holes.push(reelInnerHole);

      const reelHubGeo = new THREE.ExtrudeGeometry(reelHubShape, {
        depth: 0.26,
        bevelEnabled: true,
        bevelThickness: 0.01,
        bevelSize: 0.01,
        bevelSegments: 2,
        curveSegments: 28
      });
      reelHubGeo.center();

      const teethRingShape = new THREE.Shape();
      teethRingShape.absarc(0, 0, 0.16, 0, Math.PI * 2, false);
      const teethHole = new THREE.Path();
      teethHole.absarc(0, 0, 0.115, 0, Math.PI * 2, true);
      teethRingShape.holes.push(teethHole);
      const teethRingGeo = new THREE.ExtrudeGeometry(teethRingShape, {
        depth: 0.27,
        bevelEnabled: false,
        curveSegments: 24
      });
      teethRingGeo.center();

      const toothGeo = new THREE.BoxGeometry(0.036, 0.055, 0.27);

      function buildReelAssembly(tapeRadius, posX) {
        const reelGroup = new THREE.Group();
        reelGroup.position.set(posX, 0.12, 0);
        reelGroup.add(new THREE.Mesh(createTapeRollGeo(tapeRadius), tapeMat));
        reelGroup.add(new THREE.Mesh(reelHubGeo, hubMat));
        reelGroup.add(new THREE.Mesh(teethRingGeo, teethMat));
        for (let t = 0; t < 6; t++) {
          const angle = (t * Math.PI) / 3;
          const r = 0.102;
          const toothMesh = new THREE.Mesh(toothGeo, teethMat);
          toothMesh.position.set(Math.cos(angle) * r, Math.sin(angle) * r, 0);
          toothMesh.rotation.z = angle;
          reelGroup.add(toothMesh);
        }
        return reelGroup;
      }

      const leftReel = buildReelAssembly(0.73, -0.56);
      const rightReel = buildReelAssembly(0.50, 0.56);
      cassetteRoot.add(leftReel);
      cassetteRoot.add(rightReel);

      // Guide Rollers, Tape Ribbon & Ribs
      const rollerGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.25, 20);
      rollerGeo.rotateX(Math.PI / 2);
      const pinGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.34, 14);
      pinGeo.rotateX(Math.PI / 2);
      const rollerMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.35, metalness: 0.2 });
      const pinMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.2, metalness: 0.85, envMap: studioEnvMap });

      [-1.24, 1.24].forEach((rx) => {
        const rGroup = new THREE.Group();
        rGroup.position.set(rx, -0.68, 0);
        rGroup.add(new THREE.Mesh(rollerGeo, rollerMat));
        rGroup.add(new THREE.Mesh(pinGeo, pinMat));
        cassetteRoot.add(rGroup);
      });

      const leftRibbon = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.88, 0.21), tapeMat);
      leftRibbon.position.set(-1.08, -0.28, 0);
      leftRibbon.rotation.z = -0.34;
      cassetteRoot.add(leftRibbon);

      const rightRibbon = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.88, 0.21), tapeMat);
      rightRibbon.position.set(0.98, -0.28, 0);
      rightRibbon.rotation.z = 0.44;
      cassetteRoot.add(rightRibbon);

      const bottomRibbon = new THREE.Mesh(new THREE.BoxGeometry(2.48, 0.018, 0.21), tapeMat);
      bottomRibbon.position.set(0, -0.78, 0);
      cassetteRoot.add(bottomRibbon);

      const topRib = new THREE.Mesh(new THREE.BoxGeometry(2.75, 0.03, 0.28), ribMat);
      topRib.position.set(0, 0.94, 0);
      cassetteRoot.add(topRib);

      const diagRibL = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.028, 0.26), ribMat);
      diagRibL.position.set(-0.95, -0.45, 0);
      diagRibL.rotation.z = 0.45;
      cassetteRoot.add(diagRibL);

      const diagRibR = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.028, 0.26), ribMat);
      diagRibR.position.set(0.95, -0.45, 0);
      diagRibR.rotation.z = -0.45;
      cassetteRoot.add(diagRibR);

      // Five Recessed Screw Bosses
      const bossGeo = new THREE.CylinderGeometry(0.068, 0.068, 0.36, 18);
      bossGeo.rotateX(Math.PI / 2);
      const screwGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.39, 14);
      screwGeo.rotateX(Math.PI / 2);
      const screwMat = new THREE.MeshStandardMaterial({
        color: 0xcbd5e1,
        metalness: 0.9,
        roughness: 0.18,
        envMap: studioEnvMap
      });

      [
        [-1.46, 0.88],
        [1.46, 0.88],
        [-1.46, -0.86],
        [1.46, -0.86],
        [0.0, -0.89]
      ].forEach(([sx, sy]) => {
        const sg = new THREE.Group();
        sg.position.set(sx, sy, 0);
        sg.add(new THREE.Mesh(bossGeo, backShellMat));
        sg.add(new THREE.Mesh(screwGeo, screwMat));
        cassetteRoot.add(sg);
      });

      // =========================================================================
      // 5. LIVE COLOR & STICKER UPDATER
      // =========================================================================
      const activeColorDot = document.getElementById('active-color-dot');
      const pickerFront = document.getElementById('picker-front');
      const pickerBack = document.getElementById('picker-back');
      const pickerReel = document.getElementById('picker-reel');
      const sliderOpacity = document.getElementById('slider-opacity');
      const presetsBar = document.getElementById('color-presets-bar');

      function applyThemeTo3D(regenerateSticker) {
        frontShellMat.color.set(activeTheme.shellFront);
        backShellMat.color.set(activeTheme.shellBack);
        seamMat.color.set(activeTheme.edgeAccent);
        ribMat.color.set(activeTheme.edgeAccent);
        hubMat.color.set(activeTheme.reelHub);
        frontShellMat.opacity = activeTheme.opacity;
        backShellMat.opacity = activeTheme.opacity;

        activeColorDot.style.background = `linear-gradient(135deg, ${activeTheme.shellFront}, ${activeTheme.shellBack})`;
        pickerFront.value = activeTheme.shellFront;
        pickerBack.value = activeTheme.shellBack;
        pickerReel.value = activeTheme.reelHub;
        sliderOpacity.value = String(activeTheme.opacity);

        if (regenerateSticker) {
          const oldTex = frontStickerMat.map;
          const newTex = createFrontStickerTexture(activeTheme);
          frontStickerMat.map = newTex;
          reverseStickerMat.map = newTex;
          frontStickerMat.needsUpdate = true;
          reverseStickerMat.needsUpdate = true;
          if (oldTex) oldTex.dispose();
        }
      }

      // Render 6 Preset Buttons
      function renderPresetButtons(selectedId) {
        presetsBar.innerHTML = '';
        COLOR_THEMES.forEach((theme) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          const isSelected = theme.id === selectedId;
          btn.className = isSelected
            ? 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-900 text-white shadow-2xs transition-all'
            : 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold text-slate-600 hover:bg-slate-200/70 transition-all';
          btn.innerHTML = `
            <span class="w-2.5 h-2.5 rounded-full border border-white/80" style="background: linear-gradient(135deg, ${theme.shellFront}, ${theme.shellBack});"></span>
            <span>${theme.name}</span>
          `;
          btn.addEventListener('click', () => {
            activeTheme = JSON.parse(JSON.stringify(theme));
            renderPresetButtons(theme.id);
            applyThemeTo3D(true);
          });
          presetsBar.appendChild(btn);
        });
      }

      renderPresetButtons(activeTheme.id);

      pickerFront.addEventListener('input', (e) => {
        const hex = e.target.value;
        activeTheme.shellFront = hex;
        activeTheme.fullName = '自訂配色 (Custom Palette)';
        activeTheme.sticker.gradStart = hex;
        activeTheme.sticker.stripLeft = hex;
        applyThemeTo3D(true);
      });

      pickerBack.addEventListener('input', (e) => {
        const hex = e.target.value;
        activeTheme.shellBack = hex;
        activeTheme.edgeAccent = hex;
        activeTheme.fullName = '自訂配色 (Custom Palette)';
        activeTheme.sticker.gradEnd = hex;
        activeTheme.sticker.stripRight = hex;
        applyThemeTo3D(true);
      });

      pickerReel.addEventListener('input', (e) => {
        activeTheme.reelHub = e.target.value;
        applyThemeTo3D(false);
      });

      sliderOpacity.addEventListener('input', (e) => {
        activeTheme.opacity = parseFloat(e.target.value);
        applyThemeTo3D(false);
      });

      // =========================================================================
      // 6. GSAP ANIMATION, MOVEMENT (XY PAN), ROTATION & CAMERA PRESETS
      // =========================================================================
      function sampleChoreography(progress) {
        const t = ((progress % 1) + 1) % 1;
        const twoPi = Math.PI * 2;
        const y = twoPi * t + 0.16 * Math.sin(twoPi * t * 2) - 0.08 * Math.sin(twoPi * t);
        const x = 0.06 * Math.cos(twoPi * t) + 0.15 * Math.sin(twoPi * t * 2 - 0.4);
        const z = -0.04 * Math.sin(twoPi * t) + 0.07 * Math.cos(twoPi * t * 3);
        return { x, y, z };
      }

      const animState = {
        progress: 0,
        offsetX: 0,
        offsetY: 0,
        offsetZ: 0
      };

      const timeline = gsap.timeline({ repeat: -1 });
      timeline.to(animState, {
        progress: 1,
        duration: 18,
        ease: 'none'
      });

      let isPlaying = true;
      let autoRotate = true;
      let interactionMode = 'rotate'; // 'rotate' | 'move'
      let isDragging = false;
      let isHovered = false;
      let zoomLevel = 1.2;
      const posOffset = { x: 0, y: 0 };

      const posXLabel = document.getElementById('pos-x-label');
      const posYLabel = document.getElementById('pos-y-label');
      const gestureHintBadge = document.getElementById('gesture-hint-badge');
      const btnModeRotate = document.getElementById('btn-mode-rotate');
      const btnModeMove = document.getElementById('btn-mode-move');
      const btnPlayToggle = document.getElementById('btn-play-toggle');
      const iconPlay = document.getElementById('icon-play');
      const labelPlay = document.getElementById('label-play');
      const btnAutoRotate = document.getElementById('btn-auto-rotate');
      const btnResetAll = document.getElementById('btn-reset-all');
      const sliderZoom = document.getElementById('slider-zoom');
      const labelZoom = document.getElementById('label-zoom');
      const btnZoomIn = document.getElementById('btn-zoom-in');
      const btnZoomOut = document.getElementById('btn-zoom-out');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const mainStageCard = document.getElementById('main-stage-card');
      const telemetryReadout = document.getElementById('telemetry-readout');

      function setPositionOffset(nx, ny, animateWithGsap) {
        posOffset.x = Math.max(-1.6, Math.min(1.6, Number(nx.toFixed(2))));
        posOffset.y = Math.max(-1.0, Math.min(1.0, Number(ny.toFixed(2))));
        posXLabel.textContent = 'X: ' + posOffset.x.toFixed(2);
        posYLabel.textContent = 'Y: ' + posOffset.y.toFixed(2);

        if (animateWithGsap) {
          gsap.to(moveGroup.position, {
            x: posOffset.x,
            y: posOffset.y,
            duration: 0.3,
            ease: 'power2.out'
          });
        } else {
          moveGroup.position.x = posOffset.x;
          moveGroup.position.y = posOffset.y;
        }
      }

      function setInteractionMode(mode) {
        interactionMode = mode;
        if (mode === 'rotate') {
          btnModeRotate.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold transition-all bg-white text-slate-900 shadow-2xs';
          btnModeMove.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold transition-all text-slate-600 hover:text-slate-900';
          stageEl.classList.remove('cursor-pan');
          stageEl.classList.add('cursor-rotate');
          gestureHintBadge.textContent = '目前模式：拖曳旋轉 3D 角度（按住 Shift 或右鍵可移動位置）';
        } else {
          btnModeMove.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold transition-all bg-white text-slate-900 shadow-2xs';
          btnModeRotate.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold transition-all text-slate-600 hover:text-slate-900';
          stageEl.classList.remove('cursor-rotate');
          stageEl.classList.add('cursor-pan');
          gestureHintBadge.textContent = '目前模式：拖曳移動卡帶位置（可自由平移畫面中的卡帶）';
        }
      }

      function updatePlaybackUI() {
        if (isPlaying) {
          iconPlay.textContent = '⏸';
          labelPlay.textContent = '暫停動畫';
          btnPlayToggle.className = 'inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all bg-pink-600 text-white shadow-2xs hover:bg-pink-700';
        } else {
          iconPlay.textContent = '▶';
          labelPlay.textContent = '播放動畫';
          btnPlayToggle.className = 'inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all bg-white text-slate-700 border border-slate-200 hover:bg-slate-100';
        }

        if (autoRotate) {
          btnAutoRotate.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition-all bg-purple-600 text-white shadow-2xs hover:bg-purple-700';
        } else {
          btnAutoRotate.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition-all bg-white text-slate-600 border border-slate-200 hover:bg-slate-100';
        }

        if (isPlaying && autoRotate && !isDragging) {
          timeline.play();
        } else {
          timeline.pause();
        }
      }

      function setZoom(newZoom) {
        const clamped = Math.min(1.8, Math.max(0.7, Number(newZoom.toFixed(2))));
        zoomLevel = clamped;
        sliderZoom.value = String(clamped);
        labelZoom.textContent = Math.round(clamped * 100) + '%';
        const targetZ = 3.6 / clamped;
        gsap.to(camera.position, {
          z: targetZ,
          duration: 0.32,
          ease: 'power2.out'
        });
      }

      function tweenToAnglePreset(targetX, targetY, targetZ) {
        autoRotate = false;
        updatePlaybackUI();
        const pose = sampleChoreography(animState.progress);
        animState.offsetX = targetX - pose.x;
        animState.offsetY = targetY - pose.y;
        animState.offsetZ = targetZ - pose.z;

        gsap.to(pivotGroup.rotation, {
          x: targetX,
          y: targetY,
          z: targetZ,
          duration: 0.65,
          ease: 'power3.out'
        });
      }

      function resetAll() {
        setPositionOffset(0, 0, true);
        setZoom(1.2);
        isPlaying = true;
        autoRotate = true;
        updatePlaybackUI();

        gsap.killTweensOf(animState);
        gsap.killTweensOf(pivotGroup.rotation);
        const pose = sampleChoreography(0);
        gsap.to(animState, {
          offsetX: 0,
          offsetY: 0,
          offsetZ: 0,
          progress: 0,
          duration: 0.75,
          ease: 'power3.out'
        });
        gsap.to(pivotGroup.rotation, {
          x: pose.x,
          y: pose.y,
          z: pose.z,
          duration: 0.75,
          ease: 'power3.out'
        });
      }

      // Wire Mode & Playback Buttons
      btnModeRotate.addEventListener('click', () => setInteractionMode('rotate'));
      btnModeMove.addEventListener('click', () => setInteractionMode('move'));

      btnPlayToggle.addEventListener('click', () => {
        isPlaying = !isPlaying;
        updatePlaybackUI();
      });

      btnAutoRotate.addEventListener('click', () => {
        autoRotate = !autoRotate;
        updatePlaybackUI();
      });

      btnResetAll.addEventListener('click', resetAll);
      stageEl.addEventListener('dblclick', resetAll);

      // Wire On-Screen XY Movement Pad
      document.getElementById('btn-move-up').addEventListener('click', () => setPositionOffset(posOffset.x, posOffset.y + 0.16, true));
      document.getElementById('btn-move-down').addEventListener('click', () => setPositionOffset(posOffset.x, posOffset.y - 0.16, true));
      document.getElementById('btn-move-left').addEventListener('click', () => setPositionOffset(posOffset.x - 0.2, posOffset.y, true));
      document.getElementById('btn-move-right').addEventListener('click', () => setPositionOffset(posOffset.x + 0.2, posOffset.y, true));
      document.getElementById('btn-move-center').addEventListener('click', () => setPositionOffset(0, 0, true));

      // Wire Quick Angle Presets
      document.getElementById('btn-view-front').addEventListener('click', () => tweenToAnglePreset(0.04, 0, 0));
      document.getElementById('btn-view-side').addEventListener('click', () => tweenToAnglePreset(0.12, Math.PI / 2, 0));
      document.getElementById('btn-view-back').addEventListener('click', () => tweenToAnglePreset(-0.06, Math.PI, 0));
      document.getElementById('btn-view-iso').addEventListener('click', () => tweenToAnglePreset(0.28, -0.62, 0.06));

      // Wire Zoom & Fullscreen
      sliderZoom.addEventListener('input', (e) => setZoom(parseFloat(e.target.value)));
      btnZoomIn.addEventListener('click', () => setZoom(zoomLevel + 0.12));
      btnZoomOut.addEventListener('click', () => setZoom(zoomLevel - 0.12));

      btnFullscreen.addEventListener('click', () => {
        const isFs = mainStageCard.classList.toggle('fullscreen-stage');
        btnFullscreen.textContent = isFs ? '✕' : '⛶';
        setTimeout(resizeStage, 50);
      });

      // Pointer / Touch Dragging (Supports Rotate Mode and Move/Pan Mode)
      let prevX = 0, prevY = 0, dragDist = 0, currentDragGesture = 'rotate';

      stageEl.addEventListener('contextmenu', (e) => e.preventDefault());
      stageEl.addEventListener('pointerenter', () => { isHovered = true; });
      stageEl.addEventListener('pointerleave', () => { isHovered = false; });

      stageEl.addEventListener('pointerdown', (e) => {
        if (e.target !== renderer.domElement && e.target !== stageEl) return;
        stageEl.setPointerCapture(e.pointerId);
        isDragging = true;
        dragDist = 0;
        prevX = e.clientX;
        prevY = e.clientY;
        currentDragGesture = (e.button === 2 || e.shiftKey) ? 'move' : interactionMode;
        timeline.pause();
      });

      stageEl.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevX;
        const dy = e.clientY - prevY;
        prevX = e.clientX;
        prevY = e.clientY;
        dragDist += Math.hypot(dx, dy);

        if (currentDragGesture === 'move') {
          const moveSpeed = 0.0042;
          setPositionOffset(posOffset.x + dx * moveSpeed, posOffset.y - dy * moveSpeed, false);
        } else {
          const rotSpeed = 0.0085;
          pivotGroup.rotation.y += dx * rotSpeed;
          pivotGroup.rotation.x = Math.max(
            -Math.PI / 2.2,
            Math.min(Math.PI / 2.2, pivotGroup.rotation.x + dy * rotSpeed)
          );
        }
      });

      function handlePointerUp(e) {
        if (!isDragging) return;
        isDragging = false;
        try { stageEl.releasePointerCapture(e.pointerId); } catch (_) {}

        if (dragDist < 6) {
          isPlaying = !isPlaying;
          updatePlaybackUI();
        } else if (currentDragGesture === 'rotate') {
          const pose = sampleChoreography(animState.progress);
          animState.offsetY = pivotGroup.rotation.y - pose.y;
          animState.offsetX = pivotGroup.rotation.x - pose.x;
          animState.offsetZ = pivotGroup.rotation.z - pose.z;

          gsap.to(animState, {
            offsetX: 0,
            offsetZ: 0,
            duration: 2.4,
            ease: 'power2.out'
          });
        }

        if (isPlaying && autoRotate) {
          timeline.play();
        }
      }

      stageEl.addEventListener('pointerup', handlePointerUp);
      stageEl.addEventListener('pointercancel', handlePointerUp);

      // Wheel Zoom
      stageEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = -e.deltaY * 0.0012;
        setZoom(zoomLevel + delta);
      }, { passive: false });

      // Pinch Zoom on Mobile
      let pinchStartDist = null;
      let pinchStartZoom = 1.2;
      stageEl.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          pinchStartDist = Math.hypot(dx, dy);
          pinchStartZoom = zoomLevel;
        }
      }, { passive: true });

      stageEl.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && pinchStartDist) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const scale = Math.hypot(dx, dy) / Math.max(1, pinchStartDist);
          setZoom(pinchStartZoom * scale);
        }
      }, { passive: true });

      stageEl.addEventListener('touchend', () => { pinchStartDist = null; }, { passive: true });

      function resizeStage() {
        const rect = stageEl.getBoundingClientRect();
        const w = Math.max(100, rect.width);
        const h = Math.max(100, rect.height);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }

      window.addEventListener('resize', resizeStage);
      setTimeout(resizeStage, 20);

      // =========================================================================
      // 7. 60 FPS RENDER LOOP
      // =========================================================================
      const fpsBadge = document.getElementById('fps-badge');
      let frameCount = 0;
      let lastFpsCheck = performance.now();
      let prevFrameTime = performance.now();

      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min(0.05, (now - prevFrameTime) / 1000);
        prevFrameTime = now;

        frameCount++;
        if (now - lastFpsCheck >= 1000) {
          const fps = Math.min(60, Math.round((frameCount * 1000) / (now - lastFpsCheck)));
          if (fpsBadge) fpsBadge.textContent = fps + ' FPS · WebGL';
          frameCount = 0;
          lastFpsCheck = now;
        }

        if (isPlaying) {
          leftReel.rotation.z -= dt * 1.35;
          rightReel.rotation.z -= dt * 1.68;
        }

        const targetScale = isHovered ? 1.035 : 1.0;
        const curScale = hoverScaleGroup.scale.x;
        const nextScale = curScale + (targetScale - curScale) * Math.min(1, dt * 10);
        hoverScaleGroup.scale.set(nextScale, nextScale, nextScale);

        if (!isDragging && isPlaying && autoRotate) {
          const pose = sampleChoreography(animState.progress);
          const tx = pose.x + animState.offsetX;
          const ty = pose.y + animState.offsetY;
          const tz = pose.z + animState.offsetZ;

          pivotGroup.rotation.x += (tx - pivotGroup.rotation.x) * 0.16;
          pivotGroup.rotation.y += (ty - pivotGroup.rotation.y) * 0.16;
          pivotGroup.rotation.z += (tz - pivotGroup.rotation.z) * 0.16;
        }

        const sinY = Math.abs(Math.sin(pivotGroup.rotation.y));
        shadowPlane.scale.x = 1.0 - 0.55 * sinY;
        shadowPlane.scale.y = 1.0 + 0.25 * sinY;

        const rawDeg = (pivotGroup.rotation.y * 180) / Math.PI;
        const normDeg = ((Math.round(rawDeg) % 360) + 360) % 360;
        const isBack = normDeg > 105 && normDeg < 255;
        const isSide = (normDeg >= 65 && normDeg <= 105) || (normDeg >= 255 && normDeg <= 295);
        const sideLabel = isSide ? 'PROFILE' : isBack ? 'SIDE B' : 'SIDE A';
        telemetryReadout.textContent = `${activeTheme.fullName} · ${sideLabel} · ${normDeg}° · POS (${posOffset.x.toFixed(2)}, ${posOffset.y.toFixed(2)})`;

        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
